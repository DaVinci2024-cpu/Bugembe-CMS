[build]
  command = "npm run build"

[build.environment]
  # These NEXT_PUBLIC_* variables are meant to be embedded in the client
  # bundle — that's what the NEXT_PUBLIC_ prefix means in Next.js. Firebase's
  # client config in particular is not a secret by design (access is
  # enforced by firestore.rules, not by hiding this config); its apiKey just
  # happens to match Google's "AIza..." API key shape, which trips Netlify's
  # generic secrets scanner as a false positive. GEMINI_API_KEY is
  # deliberately left out of this list — it's server-only (used in
  # app/api/chat/route.ts) and should keep failing the build if it ever
  # leaks into client-visible output.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_SUPER_ADMIN_EMAIL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET"
